name: check
on: [push, pull_request, workflow_dispatch]
jobs:
  site:
    # Local links, images, #fragments and alt text. External links are not fetched.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 .github/check_site.py
