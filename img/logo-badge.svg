  <!-- north index -->
  <path d="M100 66 l-5 10 h10 z" fill="#d4894a"/>

  <g clip-path="url(#ring)">
    <!-- survey scan fan with range ticks -->
    <g stroke="#d4894a" stroke-width="1.8" opacity="0.75" stroke-dasharray="2 4">
      <line x1="100" y1="76" x2="72" y2="126"/>
      <line x1="100" y1="76" x2="100" y2="132"/>
      <line x1="100" y1="76" x2="128" y2="126"/>
    </g>
    <g stroke="#d4894a" stroke-width="1.5" opacity="0.7">
      <path d="M84 104 Q100 113 116 104"/>
      <path d="M78 120 Q100 131 122 120"/>
    </g>

    <!-- ridge + contour -->
    <path d="M14 144 Q54 124 92 138 Q126 150 186 130" stroke="#d4894a" stroke-width="3"/>
    <path d="M20 160 Q64 146 106 156 Q140 164 184 152" stroke="#d4894a" stroke-width="1.5" opacity="0.5"/>

    <!-- pines -->
    <g stroke="#d4894a" stroke-width="1.6" fill="#152019">
      <path d="M60 120 l-7 9 h4 l-6 8 h5 l-7 9 h24 l-7 -9 h5 l-6 -8 h4 z"/>
      <path d="M148 124 l-6 8 h3 l-5 7 h4 l-6 8 h20 l-6 -8 h4 l-5 -7 h3 z"/>
    </g>

    <!-- clearing: knock ridge back to forest so the reticle reads (figure/ground, not a 3rd color) -->
    <circle cx="100" cy="138" r="13" fill="#152019"/>

    <!-- surveyor benchmark reticle at landing point -->
    <g stroke="#d4894a" stroke-width="1.6">
      <path d="M100 126 l9 15 h-18 z" fill="none" opacity="0.85"/>
      <line x1="100" y1="129" x2="100" y2="121"/>
      <line x1="100" y1="145" x2="100" y2="151"/>
      <line x1="90" y1="139" x2="84" y2="139"/>
      <line x1="110" y1="139" x2="116" y2="139"/>
    </g>
    <circle cx="100" cy="139" r="3" fill="#d4894a"/>

    <!-- quadcopter (front view) -->
    <g stroke="#d4894a" stroke-width="3.5">
      <line x1="86" y1="58" x2="58" y2="52"/>
      <line x1="114" y1="58" x2="142" y2="52"/>
      <rect x="84" y="52" width="32" height="18" rx="5" fill="#152019"/>
      <circle cx="58" cy="52" r="2.5" fill="#d4894a"/>
      <circle cx="142" cy="52" r="2.5" fill="#d4894a"/>
      <ellipse cx="58" cy="48" rx="15" ry="3.5"/>
      <ellipse cx="142" cy="48" rx="15" ry="3.5"/>
    </g>
    <circle cx="100" cy="73" r="5" fill="#d4894a"/>
  </g>
</svg>
