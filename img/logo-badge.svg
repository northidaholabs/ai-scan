  <circle cx="100" cy="100" r="88" fill="none" stroke="#d4894a" stroke-width="1.5" opacity="0.5"/>
  <circle cx="100" cy="100" r="72" fill="none" stroke="#d4894a" stroke-width="1" opacity="0.35"/>

  <g clip-path="url(#grid)" stroke="#d4894a" stroke-width="0.8" opacity="0.12">
    <line x1="20" y1="12" x2="20" y2="188"/>
    <line x1="12" y1="20" x2="188" y2="20"/>
    <line x1="36" y1="12" x2="36" y2="188"/>
    <line x1="12" y1="36" x2="188" y2="36"/>
    <line x1="52" y1="12" x2="52" y2="188"/>
    <line x1="12" y1="52" x2="188" y2="52"/>
    <line x1="68" y1="12" x2="68" y2="188"/>
    <line x1="12" y1="68" x2="188" y2="68"/>
    <line x1="84" y1="12" x2="84" y2="188"/>
    <line x1="12" y1="84" x2="188" y2="84"/>
    <line x1="100" y1="12" x2="100" y2="188"/>
    <line x1="12" y1="100" x2="188" y2="100"/>
    <line x1="116" y1="12" x2="116" y2="188"/>
    <line x1="12" y1="116" x2="188" y2="116"/>
    <line x1="132" y1="12" x2="132" y2="188"/>
    <line x1="12" y1="132" x2="188" y2="132"/>
    <line x1="148" y1="12" x2="148" y2="188"/>
    <line x1="12" y1="148" x2="188" y2="148"/>
    <line x1="164" y1="12" x2="164" y2="188"/>
    <line x1="12" y1="164" x2="188" y2="164"/>
    <line x1="180" y1="12" x2="180" y2="188"/>
    <line x1="12" y1="180" x2="188" y2="180"/>
  </g>

  <g stroke="#d4894a" stroke-linecap="round">
    <line x1="186.0" y1="100.0" x2="175.0" y2="100.0" stroke-width="2.0"/>
    <line x1="183.1" y1="122.3" x2="178.2" y2="121.0" stroke-width="1.1"/>
    <line x1="174.5" y1="143.0" x2="170.1" y2="140.5" stroke-width="1.1"/>
    <line x1="160.8" y1="160.8" x2="153.0" y2="153.0" stroke-width="2.0"/>
    <line x1="143.0" y1="174.5" x2="140.5" y2="170.1" stroke-width="1.1"/>
    <line x1="122.3" y1="183.1" x2="121.0" y2="178.2" stroke-width="1.1"/>
    <line x1="100.0" y1="186.0" x2="100.0" y2="175.0" stroke-width="2.0"/>
    <line x1="77.7" y1="183.1" x2="79.0" y2="178.2" stroke-width="1.1"/>
    <line x1="57.0" y1="174.5" x2="59.5" y2="170.1" stroke-width="1.1"/>
    <line x1="39.2" y1="160.8" x2="47.0" y2="153.0" stroke-width="2.0"/>
    <line x1="25.5" y1="143.0" x2="29.9" y2="140.5" stroke-width="1.1"/>
    <line x1="16.9" y1="122.3" x2="21.8" y2="121.0" stroke-width="1.1"/>
    <line x1="14.0" y1="100.0" x2="25.0" y2="100.0" stroke-width="2.0"/>
    <line x1="16.9" y1="77.7" x2="21.8" y2="79.0" stroke-width="1.1"/>
    <line x1="25.5" y1="57.0" x2="29.9" y2="59.5" stroke-width="1.1"/>
    <line x1="39.2" y1="39.2" x2="47.0" y2="47.0" stroke-width="2.0"/>
    <line x1="57.0" y1="25.5" x2="59.5" y2="29.9" stroke-width="1.1"/>
    <line x1="77.7" y1="16.9" x2="79.0" y2="21.8" stroke-width="1.1"/>
    <line x1="100.0" y1="14.0" x2="100.0" y2="25.0" stroke-width="2.0"/>
    <line x1="122.3" y1="16.9" x2="121.0" y2="21.8" stroke-width="1.1"/>
    <line x1="143.0" y1="25.5" x2="140.5" y2="29.9" stroke-width="1.1"/>
    <line x1="160.8" y1="39.2" x2="153.0" y2="47.0" stroke-width="2.0"/>
    <line x1="174.5" y1="57.0" x2="170.1" y2="59.5" stroke-width="1.1"/>
    <line x1="183.1" y1="77.7" x2="178.2" y2="79.0" stroke-width="1.1"/>
